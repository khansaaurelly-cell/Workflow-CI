name: CI MLflow

on:
  push:
    branches:
      - main

jobs:
  run-mlflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install mlflow

      - name: Fix conda activate
        run: |
          echo "source /usr/share/miniconda/etc/profile.d/conda.sh" >> ~/.bashrc

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run .